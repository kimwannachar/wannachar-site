name: Sync Medium articles

on:
  schedule:
    # GitHub's cron is best-effort and delays on-the-hour jobs the most,
    # so schedule at an odd minute. Two runs a day: 00:37 UTC (07:37
    # Bangkok) and 12:37 UTC (19:37 Bangkok) so evening posts appear the
    # same night instead of waiting for the next morning.
    - cron: "37 0 * * *"
    - cron: "37 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Medium sync script
        run: python3 scripts/sync_medium.py

      - name: Commit and push if anything changed
        run: |
          git add index.html articles feed.xml
          if git diff --cached --quiet; then
            echo "No article changes."
            exit 0
          fi
          git config user.name "medium-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: sync Medium articles"
          git push
